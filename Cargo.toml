[package]
name = "app_manager"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = "0.27"
winreg = "0.52"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
winapi = { version = "0.3.9", features = ["shellapi", "winuser", "wingdi"] }
image = { version = "0.24", default-features = false, features = ["png", "ico"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
strip = true
