name: winget

# Release 正式发布后，自动向 microsoft/winget-pkgs 提交新版本清单（PR）。
# 前提：release 由 PAT 创建（见 release.yml 的 GH_TOKEN）——GITHUB_TOKEN 的
# release 事件不会触发本工作流。0.1.1 已错过自动触发，等 0.1.0（PR #474227）
# 入库后可在 Actions 页手动触发本工作流、填 release_tag=v0.1.1 补交。
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要提交的 release tag（如 v0.1.1）'
        required: true
        type: string

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: 向 winget-pkgs 提交新版本清单
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ultravires.WinAppManager
          installers-regex: '\.zip$'
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}

# 说明：
# 1. 需要在仓库 Settings → Secrets and variables → Actions 配置 WINGET_TOKEN：
#    GitHub 经典 PAT，勾选 public_repo 权限（该 PAT 账号需已签署 Microsoft CLA）。
# 2. 此动作依赖包已存在于 winget-pkgs（它走 Komac update 流程），
#    因此首个版本 0.1.0 需手动提交（见 packaging/winget/README.md），
#    合入后此工作流才对后续版本生效。
