name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'app_manager' | Select-Object -First 1 -ExpandProperty version
          $tagVersion = $env:TAG.TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "tag ($env:TAG) 与 Cargo.toml version ($cargoVersion) 不一致，请先更新 version"
          }

      - name: 构建 release
        run: cargo build --release --locked

      - name: 打包并计算 SHA-256
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "winapp-manager-$env:TAG-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/app_manager.exe dist/app_manager.exe
          Compress-Archive -Path dist/app_manager.exe -DestinationPath "dist/$zip" -Force
          $exeHash = (Get-FileHash dist/app_manager.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          @("$exeHash  app_manager.exe", "$zipHash  $zip") |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: winapp-manager-${{ github.ref_name }}-x64
          path: dist/*
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "winapp-manager $env:TAG" --generate-notes
          }
          gh release upload $env:TAG dist/* --clobber
